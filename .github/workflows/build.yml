name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk GpsMeter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GpsMeter-apk
          path: GpsMeter.apk
      - name: Terbitkan ke Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" GpsMeter.apk \
            --title "GPS Meter v1.0.${{ github.run_number }}" \
            --notes "Unduh GpsMeter.apk di bawah lalu pasang di HP Android." \
            --latest
